<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reena Sultan · Client Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D9732B'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='28' fill='white' text-anchor='middle'%3ERS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#F5EDE0;--cream2:#EADBC6;--card:#FFFDF9;--orange:#D9732B;--orange2:#F6E1D1;--brown:#3B2A20;--muted:#8A7565;--line:#E6D8C6;--green:#3E7D5A;--green2:#E2F0E6;--blue:#2F5E9E;--blue2:#E3ECF8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--brown);font:15px/1.6 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--orange)}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:400}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.logo{height:40px}
.hwrap .who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.4}
.hwrap .who b{display:block;color:var(--brown);font-size:13px}
nav{max-width:1080px;margin:auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{all:unset;cursor:pointer;padding:10px 14px 12px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brown);border-color:var(--orange)}
main{max-width:1080px;margin:auto;padding:28px 20px 80px}
h1.page{font-size:34px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:24px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}h1.page{font-size:28px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat .n{font-family:"Playfair Display",serif;font-size:34px;line-height:1.1}
.stat .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--orange2);color:var(--orange)}
.chip.seo{background:var(--blue2);color:var(--blue)}.chip.social{background:#F4E3EC;color:#9B3D6B}.chip.website{background:var(--green2);color:var(--green)}.chip.design{background:var(--orange2);color:var(--orange)}.chip.other{background:#EEE;color:#666}
.chip.done,.chip.published{background:var(--green2);color:var(--green)}.chip.doing,.chip.processing{background:var(--blue2);color:var(--blue)}.chip.todo,.chip.scheduled{background:#F1EBE2;color:var(--muted)}.chip.failed{background:#FBE3E0;color:#B23B2B}
.upd{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:20px 0;border-top:1px solid var(--line)}
.upd:first-child{border-top:0}
.upd .d{font-size:13px;color:var(--muted)}.upd .d b{display:block;font-family:"Playfair Display",serif;font-size:26px;color:var(--brown);font-weight:400;line-height:1}
.upd h3{font-family:"Playfair Display",serif;font-weight:400;font-size:21px;margin:6px 0 6px}
.upd p{white-space:pre-wrap;color:#5A463A}
.upd .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.upd .imgs img{height:120px;border-radius:10px;cursor:zoom-in}
.upd .links a{margin-right:14px;font-size:13px;font-weight:600;text-decoration:none}
@media(max-width:620px){.upd{grid-template-columns:1fr;gap:4px}.upd .d b{display:inline;font-size:18px;margin-right:6px}}
.tools{display:flex;gap:8px;margin-top:10px}.tools button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);text-decoration:underline}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;padding:4px 0}
.cal .c{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .c.out{opacity:.35}.cal .c.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.cal .dn{font-size:12px;font-weight:600;color:var(--muted)}
.tile{display:flex;gap:6px;align-items:center;font-size:11px;line-height:1.2;cursor:pointer;border-radius:6px;padding:2px}
.tile:hover{background:var(--cream)}
.tile .th{width:30px;height:38px;border-radius:5px;object-fit:cover;background:var(--cream2);flex:none}
.tile .k{font-weight:600}.tile .k.reel{color:#9B3D6B}.tile .k.story{color:var(--blue)}.tile .k.image,.tile .k.carousel{color:var(--orange)}
.tile .ok{color:var(--green)}
@media(max-width:820px){.cal{display:none}.calList{display:block!important}}
.calList{display:none}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li img{width:48px;height:60px;object-fit:cover;border-radius:8px}
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.monthbar button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:99px;width:32px;height:32px;text-align:center;line-height:32px}
.monthbar h2{font-size:24px;min-width:200px}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
.bar{height:10px;background:var(--cream2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);border-radius:99px}
.seo-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.seo-row .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;margin-top:2px}
.seo-row.done .box{background:var(--green);border-color:var(--green)}.seo-row.doing .box{border-color:var(--blue);background:var(--blue2)}
.seo-row.done .t{text-decoration:line-through;color:var(--muted)}
.seo-row .t{font-weight:600}.seo-row .dt{font-size:13px;color:var(--muted);margin-top:2px}
.seo-row .pr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}.pr.high{color:#B23B2B}.pr.medium{color:var(--orange)}.pr.low{color:var(--muted)}
.btn{all:unset;cursor:pointer;background:var(--orange);color:#fff;font-weight:600;font-size:13px;padding:10px 18px;border-radius:99px;display:inline-block}
.btn.ghost{background:transparent;color:var(--brown);border:1px solid var(--line)}
.admin-only{display:none}body.admin .admin-only{display:revert}
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.modal .card{width:100%;max-width:540px;max-height:92vh;overflow:auto}
.modal img.big{max-width:100%;max-height:70vh;border-radius:12px;display:block;margin:auto}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--brown)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:60}
.toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--muted);padding:30px}
footer button{all:unset;cursor:pointer;text-decoration:underline}
.ig{display:flex;align-items:center;gap:14px}.ig img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)}
.preview video,.preview img{max-width:100%;max-height:60vh;border-radius:12px;display:block;margin:0 auto 12px}
.locked{max-width:420px;margin:12vh auto;text-align:center}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <img class="logo" src="https://reenasultan.com/wp-content/uploads/2026/05/cropped-Logo-314x138.png" alt="Reena Sultan">
    <div class="who"><b>Client Portal</b>Managed by Trendhive Digital</div>
  </div>
  <nav id="nav">
    <button data-v="today" class="on">Today</button>
    <button data-v="updates">Daily updates</button>
    <button data-v="calendar">Content calendar</button>
    <button data-v="report">Monthly report</button>
    <button data-v="seo">SEO</button>
  </nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<footer>Reena Sultan · Client Portal · <span id="adminLink"><button onclick="openLogin()">Team login</button></span></footer>

<div class="modal" id="m"><div class="card" id="mc"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://suzdbupzgyynxfrjjsfv.supabase.co";
const SUPABASE_KEY = "sb_publishable_TcLqLrx7Pquh8Ofi1eBE1A_wzMDyCfM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const qs = new URLSearchParams(location.search);
const SLUG = qs.get("p") || "reena-sultan";
const KEY = qs.get("k") || localStorage.getItem("cp_key_" + SLUG) || "";
if (qs.get("k")) try { localStorage.setItem("cp_key_" + SLUG, qs.get("k")); } catch (e) {}
const TZ = "Asia/Karachi";
let D = null, view = "today", portalId = null, user = null, calMonth = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (d, o) => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, ...o }).format(new Date(d));
const dayKey = (d) => fmt(d, { year: "numeric", month: "2-digit", day: "2-digit" }).split("/").reverse().join("-");
const todayKey = () => dayKey(new Date());
const TYPE = { image: "Post", carousel: "Carousel", reel: "Reel", story: "Story" };
const CAT = { social: "Social media", seo: "SEO", website: "Website", design: "Design", other: "Other" };
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 2600); }
function modal(html) { $("#mc").innerHTML = html; $("#m").classList.add("on"); }
function closeM() { $("#m").classList.remove("on"); }
$("#m").addEventListener("click", (e) => { if (e.target.id === "m") closeM(); });

async function load() {
  if (!KEY) return locked();
  const { data, error } = await sb.rpc("cp_view", { p_slug: SLUG, p_key: KEY });
  if (error || !data) return locked();
  D = data; render();
}
function locked() {
  $("#nav").style.display = "none";
  $("#main").innerHTML = `<div class="locked card"><div class="eb">Private portal</div><h1 class="serif" style="font-size:28px;margin:8px 0">This link isn't valid</h1><p class="sub">Please use the private link shared by your Trendhive team.</p></div>`;
}

$("#nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; document.querySelectorAll("#nav button").forEach((x) => x.classList.toggle("on", x === b)); render(); scrollTo(0, 0); });

function thumb(p) { const m = (p.media || [])[0]; if (!m) return ""; return m.kind === "video" ? (m.thumb || "") : m.url; }
function mediaTag(m, cls = "th") {
  if (!m) return `<div class="${cls}"></div>`;
  if (m.kind === "video") return m.thumb ? `<img class="${cls}" src="${esc(m.thumb)}" alt="">` : `<video class="${cls}" src="${esc(m.url)}#t=1" muted preload="metadata"></video>`;
  return `<img class="${cls}" src="${esc(m.url)}" alt="" loading="lazy">`;
}

function render() {
  const f = { today: vToday, updates: vUpdates, calendar: vCalendar, report: vReport, seo: vSeo }[view];
  $("#main").innerHTML = f();
  document.querySelectorAll("[data-post]").forEach((el) => el.addEventListener("click", () => showPost(+el.dataset.post)));
}

function updCard(u) {
  const imgs = (u.images || []).map((i) => `<img src="${esc(i)}" onclick="zoom('${esc(i)}')" alt="">`).join("");
  const links = (u.links || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || "Link")} ↗</a>`).join("");
  return `<div class="upd"><div class="d"><b>${fmt(u.date + "T12:00:00Z", { day: "numeric" })}</b>${fmt(u.date + "T12:00:00Z", { month: "short", year: "numeric" })}</div>
  <div><span class="chip ${esc(u.category)}">${CAT[u.category] || u.category}</span><h3>${esc(u.title)}</h3><p>${esc(u.body)}</p>
  ${imgs ? `<div class="imgs">${imgs}</div>` : ""}${links ? `<div class="links" style="margin-top:8px">${links}</div>` : ""}
  <div class="tools admin-only"><button onclick="editUpdate('${u.id}')">Edit</button><button onclick="delUpdate('${u.id}')">Delete</button></div></div></div>`;
}

function vToday() {
  const tk = todayKey(), posts = D.posts || [];
  const todays = posts.map((p, i) => ({ ...p, i })).filter((p) => dayKey(p.scheduled_at) === tk);
  const next = posts.map((p, i) => ({ ...p, i })).filter((p) => p.status === "scheduled" && new Date(p.scheduled_at) > new Date()).slice(0, 4);
  const latestDate = (D.updates[0] || {}).date;
  const latest = D.updates.filter((u) => u.date === latestDate);
  const a = D.account || {};
  return `<div class="eb">${fmt(new Date(), { weekday: "long", day: "numeric", month: "long" })}</div>
  <h1 class="page serif">Good ${greet()}, ${esc(D.brand)}</h1><p class="sub">Here's what we're working on for you.</p>
  <div class="grid g4" style="margin-bottom:16px">
    ${stat(a.followers ?? "—", "Instagram followers")}${stat(D.month.published, "Published this month")}${stat(D.month.scheduled, "Scheduled ahead")}${stat(D.month.seo_done + "/" + D.month.seo_total, "SEO tasks done")}
  </div>
  <div class="grid g2">
    <div class="card"><div class="row" style="align-items:center"><div><div class="eb">Latest update</div></div><div style="text-align:right" class="admin-only"><button class="btn" onclick="editUpdate()">+ Add update</button></div></div>
      ${latest.length ? latest.map(updCard).join("") : `<div class="empty">No updates yet.</div>`}
      ${D.updates.length > latest.length ? `<button class="btn ghost" onclick="go('updates')">See all updates</button>` : ""}</div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="eb">Going live today</div>${todays.length ? todays.map(li).join("") : `<p class="sub" style="margin:8px 0 0">Nothing scheduled today.</p>`}</div>
      <div class="card"><div class="eb">Coming up</div>${next.length ? next.map(li).join("") : `<p class="sub" style="margin:8px 0 0">Nothing scheduled.</p>`}
        <button class="btn ghost" style="margin-top:12px" onclick="go('calendar')">Open calendar</button></div>
    </div>
  </div>`;
}
const greet = () => { const h = +fmt(new Date(), { hour: "numeric", hour12: false }); return h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"; };
const stat = (n, l) => `<div class="card stat"><div class="n">${esc(n)}</div><div class="l">${l}</div></div>`;
function li(p) {
  return `<div class="li" data-post="${p.i}">${mediaTag((p.media || [])[0], "")}<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${TYPE[p.post_type || p.type] || p.type} · ${fmt(p.scheduled_at, { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</div>
  <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((p.caption || "Story").split("\n")[0])}</div></div><span class="chip ${p.status}">${p.status}</span></div>`;
}
function go(v) { document.querySelector(`#nav button[data-v="${v}"]`).click(); }

function vUpdates() {
  const cats = ["all", ...new Set(D.updates.map((u) => u.category))];
  const sel = window._cat || "all";
  const list = D.updates.filter((u) => sel === "all" || u.category === sel);
  return `<div class="row" style="align-items:end;margin-bottom:8px"><div><h1 class="page serif">Daily updates</h1><p class="sub">Everything we've done for ${esc(D.brand)}, day by day.</p></div>
  <div style="text-align:right;flex:0" class="admin-only"><button class="btn" onclick="editUpdate()">+ Add update</button></div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${cats.map((c) => `<button class="chip ${c === sel ? "" : "todo"}" style="border:0;cursor:pointer" onclick="window._cat='${c}';render()">${c === "all" ? "All" : CAT[c] || c}</button>`).join("")}</div>
  <div class="card">${list.length ? list.map(updCard).join("") : `<div class="empty">No updates yet.</div>`}</div>`;
}

function vCalendar() {
  const posts = (D.posts || []).map((p, i) => ({ ...p, i }));
  if (!calMonth) { const now = new Date(); calMonth = { y: +fmt(now, { year: "numeric" }), m: +fmt(now, { month: "numeric" }) - 1 }; }
  const { y, m } = calMonth, first = new Date(Date.UTC(y, m, 1)), start = (first.getUTCDay() + 6) % 7, days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const by = {}; posts.forEach((p) => { (by[dayKey(p.scheduled_at)] ||= []).push(p); });
  const tk = todayKey(); let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(Date.UTC(y, m, 1 - start + i)), k = d.toISOString().slice(0, 10), inM = d.getUTCMonth() === m;
    if (i >= 35 && !inM) break;
    const items = (by[k] || []).map((p) => `<div class="tile" data-post="${p.i}">${mediaTag((p.media || [])[0])}<div><div class="k ${p.type}">${TYPE[p.type]}</div><div>${fmt(p.scheduled_at, { hour: "numeric", minute: "2-digit" })} ${p.status === "published" ? '<span class="ok">✓</span>' : ""}</div></div></div>`).join("");
    cells += `<div class="c ${inM ? "" : "out"} ${k === tk ? "today" : ""}"><div class="dn">${d.getUTCDate()}</div>${items}</div>`;
  }
  const monthPosts = posts.filter((p) => dayKey(p.scheduled_at).startsWith(`${y}-${String(m + 1).padStart(2, "0")}`));
  const name = new Date(Date.UTC(y, m, 15)).toLocaleString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" });
  return `<h1 class="page serif">Content calendar</h1><p class="sub">Every post, reel and story for Instagram @${esc(D.ig_username)}. Tap any item to preview it.</p>
  <div class="monthbar"><button onclick="shiftM(-1)">‹</button><h2 class="serif">${name}</h2><button onclick="shiftM(1)">›</button>
  <div class="legend"><span style="color:var(--orange)">● Post</span><span style="color:#9B3D6B">● Reel</span><span style="color:var(--blue)">● Story</span><span style="color:var(--green)">✓ Live</span></div></div>
  <div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="h">${d}</div>`).join("")}${cells}</div>
  <div class="calList card">${monthPosts.length ? monthPosts.map((p) => li(p)).join("") : `<div class="empty">Nothing this month.</div>`}</div>`;
}
function shiftM(n) { let { y, m } = calMonth; m += n; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } calMonth = { y, m }; render(); }
function showPost(i) {
  const p = D.posts[i], md = (p.media || [])[0];
  const media = md ? (md.kind === "video" ? `<video src="${esc(md.url)}" controls playsinline></video>` : `<img src="${esc(md.url)}" alt="">`) : "";
  modal(`<div class="preview">${media}<div class="row" style="align-items:center;margin-bottom:8px"><div><span class="chip ${p.status}">${p.status}</span> <b style="margin-left:6px">${TYPE[p.type]}</b></div>
  <div style="text-align:right;font-size:13px;color:var(--muted)">${fmt(p.scheduled_at, { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" })}</div></div>
  ${p.caption ? `<p style="white-space:pre-wrap;font-size:14px">${esc(p.caption)}</p>` : ""}
  ${p.permalink ? `<p style="margin-top:12px"><a class="btn" href="${esc(p.permalink)}" target="_blank" rel="noopener">View on Instagram ↗</a></p>` : ""}
  <p style="margin-top:14px"><button class="btn ghost" onclick="closeM()">Close</button></p></div>`);
}
function zoom(u) { modal(`<img class="big" src="${esc(u)}"><p style="text-align:center;margin-top:12px"><button class="btn ghost" onclick="closeM()">Close</button></p>`); }

function vReport() {
  const M = D.month, a = D.account || {}, name = fmt(new Date(), { month: "long", year: "numeric" });
  const cats = {}; D.updates.forEach((u) => { if (u.date.slice(0, 7) === todayKey().slice(0, 7)) cats[u.category] = (cats[u.category] || 0) + 1; });
  const pct = M.seo_total ? Math.round((M.seo_done / M.seo_total) * 100) : 0;
  return `<div class="eb">Monthly report</div><h1 class="page serif">${name}</h1><p class="sub">A snapshot of your brand's growth and the work delivered this month.</p>
  <div class="card ig" style="margin-bottom:16px">${a.picture ? `<img src="${esc(a.picture)}" alt="">` : ""}<div><div style="font-weight:600">@${esc(a.username || D.ig_username)}</div><div style="color:var(--muted);font-size:13px">${esc(a.name || "")}</div></div>
    <div style="margin-left:auto;display:flex;gap:28px;text-align:center"><div class="stat"><div class="n">${a.followers ?? "—"}</div><div class="l">Followers</div></div><div class="stat"><div class="n">${a.media_count ?? "—"}</div><div class="l">Total posts</div></div></div></div>
  <div class="grid g4" style="margin-bottom:16px">${stat(M.feed, "Feed posts")}${stat(M.reels, "Reels")}${stat(M.stories, "Stories")}${stat(M.published, "Already live")}</div>
  <div class="grid g2">
    <div class="card"><div class="eb">Work delivered this month</div><div style="margin-top:12px">${Object.keys(cats).length ? Object.entries(cats).map(([c, n]) => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span>${CAT[c] || c}</span><b style="flex:0">${n}</b></div>`).join("") : `<p class="sub">No updates yet this month.</p>`}
      <div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b>Total updates</b><b style="flex:0">${M.updates}</b></div></div></div>
    <div class="card"><div class="eb">Website SEO progress</div><div class="serif" style="font-size:40px;margin:10px 0 6px">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div>
      <p class="sub" style="margin:10px 0 0">${M.seo_done} of ${M.seo_total} improvements complete.</p><button class="btn ghost" onclick="go('seo')">See SEO checklist</button></div>
  </div>
  ${a.stats_at ? `<p class="sub" style="margin-top:14px;font-size:12px">Instagram figures last refreshed ${fmt(a.stats_at, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}.</p>` : ""}
  <p style="margin-top:8px"><button class="btn ghost" onclick="print()">Print / save as PDF</button></p>`;
}

function vSeo() {
  const t = D.seo, done = t.filter((x) => x.status === "done").length, pct = t.length ? Math.round((done / t.length) * 100) : 0;
  const areas = [...new Set(t.map((x) => x.area))];
  return `<div class="row" style="align-items:end"><div><h1 class="page serif">Website SEO</h1><p class="sub">Improvements for <a href="${esc(D.website)}" target="_blank">${esc((D.website || "").replace(/^https?:\/\//, ""))}</a> so more people find you on Google.</p></div>
  <div style="flex:0;white-space:nowrap" class="admin-only"><button class="btn" onclick="editSeo()">+ Add task</button></div></div>
  <div class="card" style="margin-bottom:16px"><div class="row" style="align-items:center"><div><div class="eb">Progress</div><div class="serif" style="font-size:34px">${done} / ${t.length} done</div></div><div style="flex:2"><div class="bar"><i style="width:${pct}%"></i></div></div></div></div>
  <div class="card">${t.map((x) => `<div class="seo-row ${x.status}"><div class="box" ${user ? `style="cursor:pointer" onclick="cycleSeo('${x.id}','${x.status}')" title="Change status"` : ""}>${x.status === "done" ? "✓" : x.status === "doing" ? "<span style='color:var(--blue)'>•</span>" : ""}</div>
    <div><div class="t">${esc(x.title)}</div><div class="dt">${esc(x.detail)}</div><div style="margin-top:6px"><span class="chip todo">${esc(x.area)}</span> <span class="chip ${x.status}">${x.status === "todo" ? "To do" : x.status === "doing" ? "In progress" : "Done"}</span></div></div>
    <div class="pr ${x.priority}">${x.priority}</div></div>`).join("") || `<div class="empty">No tasks yet.</div>`}</div>`;
}

/* ---------- team (admin) ---------- */
function openLogin() {
  if (user) return logout();
  modal(`<div class="eb">Team login</div><h2 class="serif" style="font-size:26px;margin:6px 0 4px">Sign in to post updates</h2><p class="sub" style="margin:0">Use your Trendhive Scheduler login.</p>
  <label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
  <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="login()">Sign in</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);
}
async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $("#le").value.trim(), password: $("#lp").value });
  if (error) return toast(error.message);
  closeM(); await initUser(); toast("Signed in");
}
async function logout() { await sb.auth.signOut(); user = null; document.body.classList.remove("admin"); $("#adminLink").innerHTML = `<button onclick="openLogin()">Team login</button>`; render(); }
async function initUser() {
  const { data } = await sb.auth.getUser(); user = data.user || null;
  if (!user) return;
  const { data: p } = await sb.from("cp_portals").select("id").eq("slug", SLUG).maybeSingle();
  if (!p) { user = null; return toast("This login can't edit this portal"); }
  portalId = p.id; document.body.classList.add("admin");
  $("#adminLink").innerHTML = `Signed in as ${esc(user.email)} · <button onclick="logout()">Sign out</button>`; render();
}

function editUpdate(id) {
  const u = id ? D.updates.find((x) => x.id === id) : { date: todayKey(), category: "social", title: "", body: "", links: [], images: [] };
  window._imgs = [...(u.images || [])];
  modal(`<div class="eb">${id ? "Edit" : "New"} update</div>
  <div class="row"><div><label>Date</label><input id="ud" type="date" value="${u.date}"></div><div><label>Type</label><select id="uc">${Object.entries(CAT).map(([k, v]) => `<option value="${k}" ${k === u.category ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
  <label>Title</label><input id="ut" value="${esc(u.title)}" placeholder="e.g. Eid campaign shoot planned">
  <label>Details</label><textarea id="ub" placeholder="What was done today?">${esc(u.body)}</textarea>
  <label>Links (one per line, "Label | https://…")</label><textarea id="ul" style="min-height:60px">${(u.links || []).map((l) => `${l.label} | ${l.url}`).join("\n")}</textarea>
  <label>Images</label><input id="uf" type="file" accept="image/*" multiple><div id="uimgs" class="upd" style="padding:6px 0;border:0;display:flex;gap:6px;flex-wrap:wrap"></div>
  <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" id="usave" onclick="saveUpdate('${id || ""}')">Save update</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);
  drawImgs(); $("#uf").addEventListener("change", uploadImgs);
}
function drawImgs() { $("#uimgs").innerHTML = window._imgs.map((s, i) => `<span style="position:relative"><img src="${esc(s)}" style="height:70px;border-radius:8px"><button onclick="window._imgs.splice(${i},1);drawImgs()" style="position:absolute;top:-6px;right:-6px;border:0;background:var(--brown);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer">×</button></span>`).join(""); }
async function uploadImgs(e) {
  const btn = $("#usave"); btn.textContent = "Uploading…";
  for (const f of e.target.files) {
    const path = `${user.id}/client-portal/${Date.now()}_${f.name.replace(/[^\w.-]+/g, "_")}`;
    const { error } = await sb.storage.from("ig-media").upload(path, f, { upsert: false, contentType: f.type });
    if (error) { toast(error.message); continue; }
    window._imgs.push(sb.storage.from("ig-media").getPublicUrl(path).data.publicUrl); drawImgs();
  }
  btn.textContent = "Save update"; e.target.value = "";
}
async function saveUpdate(id) {
  const links = $("#ul").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => { const [a, b] = l.includes("|") ? l.split("|") : [l, l]; return { label: a.trim(), url: (b || a).trim() }; });
  const row = { portal_id: portalId, update_date: $("#ud").value, category: $("#uc").value, title: $("#ut").value.trim(), body: $("#ub").value.trim(), links, images: window._imgs };
  if (!row.title) return toast("Add a title");
  const q = id ? sb.from("cp_updates").update(row).eq("id", id) : sb.from("cp_updates").insert(row);
  const { error } = await q; if (error) return toast(error.message);
  closeM(); toast("Update saved"); load();
}
async function delUpdate(id) { if (!confirmDel()) return; const { error } = await sb.from("cp_updates").delete().eq("id", id); if (error) return toast(error.message); toast("Deleted"); load(); }
function confirmDel() { return window.confirm("Delete this update?"); }
async function cycleSeo(id, s) {
  const next = s === "todo" ? "doing" : s === "doing" ? "done" : "todo";
  const { error } = await sb.from("cp_seo_tasks").update({ status: next, done_at: next === "done" ? new Date().toISOString() : null }).eq("id", id);
  if (error) return toast(error.message); load();
}
function editSeo() {
  modal(`<div class="eb">New SEO task</div><label>Task</label><input id="st"><label>Details</label><textarea id="sd" style="min-height:70px"></textarea>
  <div class="row"><div><label>Area</label><input id="sa" value="On-page"></div><div><label>Priority</label><select id="sp"><option>high</option><option selected>medium</option><option>low</option></select></div></div>
  <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="saveSeo()">Add task</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`);
}
async function saveSeo() {
  const row = { portal_id: portalId, title: $("#st").value.trim(), detail: $("#sd").value.trim(), area: $("#sa").value.trim() || "On-page", priority: $("#sp").value, sort: (D.seo.length || 0) + 1 };
  if (!row.title) return toast("Add a task"); const { error } = await sb.from("cp_seo_tasks").insert(row); if (error) return toast(error.message); closeM(); load();
}

load().then(initUser);
</script>
</body>
</html>
